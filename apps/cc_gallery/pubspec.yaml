name: cc_gallery
description: "Widgetbook gallery for the Control Center design system (cc_ui)."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cc_ui:
    path: ../../packages/cc_ui
  cc_markdown:
    path: ../../packages/cc_markdown
  # Storybook-equivalent gallery, on widgetbook 4's stories setup: one
  # `lib/stories/*.stories.dart` file per component (a `ComponentMeta`, a
  # `Meta` and `$`-prefixed stories), from which widgetbook's own builders
  # (build_runner; the old widgetbook_generator is merged into widgetbook)
  # generate the `*.stories.g.dart` parts and `lib/components.g.dart`.
  widgetbook: 4.0.0-beta.14
  # Live accessibility checker overlay for the gallery (a BuilderAddon in
  # main.dart). Built on material_ui. Debug-only.
  accessibility_tools: ^3.0.0
  # The previews' Material localizations and the bridge that re-provides a
  # theme to widgetbook's legacy-Material viewport frame (see main.dart).
  material_ui: ^1.6.0
  # Renders the brand mark SVG in the navigation sidebar header. Same version
  # the host app pins, so the shared workspace lockfile stays consistent.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
