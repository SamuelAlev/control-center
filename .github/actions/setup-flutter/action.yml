name: Set up Flutter
description: >
  Install the pinned Flutter SDK and resolve dependencies. Requires a checkout
  already: harden-runner must stay the job's first step, and this action reads
  the workspace.

inputs:
  pub-get:
    description: Run `flutter pub get`. Disable for a job that only needs the SDK.
    required: false
    default: "true"
  working-directory:
    description: Directory to resolve dependencies in.
    required: false
    default: "."
  windowing:
    description: >
      Enable Flutter's multi-window flag. Desktop builds need it on.
      Windows test jobs pass false: flutter_tester cannot resolve
      InternalFlutterWindows_WindowManager_Initialize, so every
      testWidgets file fails to load.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # `.fvmrc` pins a commit, so flutter-action checks out the full SDK.
    # Windows git rejects the SDK's iOS golden paths (>260 chars) unless
    # core.longpaths is on.
    - name: Allow long paths in git (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: git config --global core.longpaths true

    - name: Install the pinned Flutter SDK
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: main
        flutter-version-file: .fvmrc # single source of truth — synced via fvm
        cache: true

    # windows-latest puts Git's GNU tar ahead of System32. Flutter runs
    # `tar -xf C:\…`, and GNU tar treats "C:" as a remote host. Stage
    # Windows tar.exe here; do not prepend it via GITHUB_PATH (that leaks
    # into every later step, and Git Bash puts /usr/bin back in front).
    # Bash steps source scripts/ci/prefer_windows_tar.sh. A PowerShell step
    # that runs Flutter prepends $RUNNER_TEMP/win-tar itself.
    # Do not prepend System32: later bash steps would pick up find.exe/sort.exe.
    - name: Stage Windows tar (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'win-tar'
        $src = Join-Path $env:SystemRoot 'System32\tar.exe'
        if (-not (Test-Path $src)) {
          throw "Windows tar.exe not found at $src"
        }
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        Copy-Item -Force -Path $src -Destination (Join-Path $dir 'tar.exe')

    # The flag is machine-global (~/.config/flutter/settings), so a fresh
    # runner builds with windowing off and the desktop shell throws at the
    # first WindowController. Skipped when windowing=false (Windows tests).
    - name: Enable the windowing feature flag
      if: inputs.windowing != 'false'
      shell: bash
      run: |
        . "$GITHUB_WORKSPACE/scripts/ci/prefer_windows_tar.sh"
        flutter config --enable-windowing

    - name: Resolve dependencies
      if: inputs.pub-get == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        . "$GITHUB_WORKSPACE/scripts/ci/prefer_windows_tar.sh"
        flutter pub get
