name: Prepare release build
description: >
  Codegen, natives, built-in credentials, and the build-identity stamp shared
  by the macOS, Windows, and Linux release jobs.

# Order is load-bearing: credentials and staged natives before any
# `dart build cli` (no -D flag; the build hook bundles build/natives and fails
# when it is empty), then the identity stamp (BuildInfo is compiled in).

inputs:
  os:
    description: macos | linux | windows
    required: true
  arch:
    description: >
      Windows only: x64 | arm64. Must match the runner and the MSVC
      environment (natives are compiled natively, never cross-compiled).
    required: false
    default: x64
  version:
    description: The release version, used for the build-identity stamp.
    required: true
  google-client-id:
    required: false
    default: ""
    description: CC_BUILTIN_GOOGLE_CLIENT_ID secret.
  google-client-secret:
    required: false
    default: ""
    description: CC_BUILTIN_GOOGLE_CLIENT_SECRET secret.
  klipy-app-key:
    required: false
    default: ""
    description: CC_BUILTIN_KLIPY_APP_KEY secret.
  github-client-id:
    required: false
    default: ""
    description: >
      Public GitHub App client id for device-flow sign-in. The private key
      is never baked in.
  fetch-code-server:
    description: >
      Fetch the pinned code-server archive. Skipped on Windows (no native host).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Code generation (drift / json_serializable)
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs

    # Seeded by natives.yml on main. A miss builds from source below.
    - name: Restore native FFI libraries from cache
      id: natives-cache
      uses: $/.github/actions/natives-cache

    # Skipped on a cache hit. No rift on Windows (`git worktree` is the backend).
    - name: Build native FFI libraries
      if: steps.natives-cache.outputs.cache-hit != 'true'
      shell: bash
      # Inputs via env, not ${{ }} inside run: (template injection).
      env:
        OS: ${{ inputs.os }}
        ARCH: ${{ inputs.arch }}
      run: |
        if [ "$OS" = "windows" ]; then
          bash scripts/release/windows_natives.sh "$ARCH"
        else
          bash scripts/natives/build_natives.sh build/natives
        fi

    # Hit and miss. Desktop + server roles are the full staged set. On Windows
    # --arch also checks each DLL's PE machine type, so a cache entry or build
    # for the other architecture can never pass by name.
    - name: Verify staged natives
      shell: bash
      env:
        OS: ${{ inputs.os }}
        ARCH: ${{ inputs.arch }}
      run: |
        arch_args=()
        [ "$OS" = "windows" ] && arch_args=(--arch "$ARCH")
        bash scripts/release/verify_natives.sh "${arch_args[@]}" build/natives "$OS" desktop
        bash scripts/release/verify_natives.sh "${arch_args[@]}" build/natives "$OS" server

    # Missing secrets are not an error; the build ships no baked credentials.
    - name: Inject built-in app credentials
      shell: bash
      env:
        CC_BUILTIN_GOOGLE_CLIENT_ID: ${{ inputs.google-client-id }}
        CC_BUILTIN_GOOGLE_CLIENT_SECRET: ${{ inputs.google-client-secret }}
        CC_BUILTIN_KLIPY_APP_KEY: ${{ inputs.klipy-app-key }}
        CC_BUILTIN_GITHUB_CLIENT_ID: ${{ inputs.github-client-id }}
      run: bash scripts/release/builtin_credentials.sh inject

    - name: Stamp build identity
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: dart run tool/gen_build_info.dart --version "$VERSION"

    # Non-fatal: the server downloads code-server on demand if this misses.
    - name: Fetch code-server standalone archive
      if: inputs.fetch-code-server == 'true' && inputs.os != 'windows'
      shell: bash
      continue-on-error: true
      run: bash scripts/release/fetch_code_server.sh
