name: Natives cache
description: >
  Restore build/natives from the Actions cache. The only cache-key definition:
  natives.yml (writer, push to main) and prepare-release-build (reader) both
  use this action.

# No restore-keys. A prefix match would restore natives built from older pins,
# and verify_natives.sh checks presence, not version.
# Tag runs can restore default-branch caches; a save on a tag is never readable
# again, so releases only consume what a push to main saved.
# `v1` is the manual bust (runner toolchain changes the key does not hash).
# The key does not cover glibc; Linux stays on ubuntu-24.04 and verify_natives.sh
# checks the ABI floor on hit and miss.

outputs:
  cache-hit:
    description: >
      "true" when the exact key was restored; anything else means build/natives
      must be built from source.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore staged natives
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/natives
        key: natives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lib/native_pins.env', 'scripts/lib/common.sh', 'scripts/lib/natives.sh', 'scripts/natives/**', 'scripts/release/windows_natives.sh', 'packages/cc_natives/native/**') }}
