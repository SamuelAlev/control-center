name: Linux desktop dependencies
description: >
  Install the GTK 3, X11 and Xi development packages, plus any job-specific
  apt packages, in one apt transaction. cnativeapi's build hook compiles
  against them through pkg-config whenever a root-package script or test
  builds native assets (`dart run tool/...`, `flutter test`, cc_server boot).
  Needs the Ubuntu apt hosts in the job's harden-runner allowlist.

# Call it with `background: true` before setup-flutter, then `wait` before the
# first step that builds native assets: the SDK download and `pub get` need
# none of these. Composite actions cannot hold background steps themselves, so
# the overlap lives in the calling job. One call per job: a second concurrent
# apt-get fails on the dpkg lock instead of queueing.
#
# The downloaded .debs are cached. The runner's Azure Ubuntu mirror regularly
# stalls on individual files, and apt then falls back package by package: a
# 25 MB download has taken minutes (116 kB/s) while dpkg needed six seconds.
# With the cache, only `apt-get update` still goes to the mirror.

inputs:
  extra-packages:
    description: Space-separated apt packages to install in the same transaction.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ImageOS/ImageVersion are runner machine variables, not in the `env`
    # context. The image version pins the package versions the index offers,
    # so it is in the key; an older image's debs still seed a new one.
    - name: Compute apt cache key
      id: apt-key
      if: runner.os == 'Linux'
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        read -r -a extra <<< "$EXTRA_PACKAGES"
        hash=$(printf '%s\n' pkg-config libgtk-3-dev libx11-dev libxi-dev \
          "${extra[@]}" | sort -u | sha256sum | cut -c1-16)
        prefix="apt-debs-v1-${ImageOS:-unknown}-${RUNNER_ARCH}-${hash}"
        {
          echo "prefix=${prefix}-"
          echo "key=${prefix}-${ImageVersion:-unknown}"
          echo "dir=$HOME/.cache/apt-debs"
        } >> "$GITHUB_OUTPUT"

    - name: Restore apt package cache
      if: runner.os == 'Linux'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: ${{ steps.apt-key.outputs.prefix }}

    - name: Install apt packages
      if: runner.os == 'Linux'
      shell: bash
      # Inputs via env, not ${{ }} inside run: (template injection).
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        DEB_DIR: ${{ steps.apt-key.outputs.dir }}
      run: |
        set -euo pipefail
        read -r -a extra <<< "$EXTRA_PACKAGES"
        # The image ships Microsoft's apt repo, which harden-runner blocks:
        # every update otherwise spends seconds retrying a refused connection.
        { grep -lrs 'packages.microsoft.com' /etc/apt/sources.list.d/ || true; } \
          | xargs -r sudo rm -f
        mkdir -p "$DEB_DIR/partial"
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::Archives="$DEB_DIR" \
          install -y --no-install-recommends \
          pkg-config libgtk-3-dev libx11-dev libxi-dev "${extra[@]}"
        # Drop debs the index no longer offers (superseded versions), and hand
        # the directory back to the runner user: apt leaves a root-only lock
        # and an _apt-owned partial/ that the cache save cannot read.
        sudo apt-get -o Dir::Cache::Archives="$DEB_DIR" autoclean
        sudo rm -rf "$DEB_DIR/partial" "$DEB_DIR/lock"
        sudo chown -R "$(id -u):$(id -g)" "$DEB_DIR"
