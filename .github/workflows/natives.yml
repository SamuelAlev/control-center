name: Natives

# Compiles native FFI libs when a native input changes: ci.yml does not build
# them, and only a push to main can seed a cache a release tag can restore.
# The key lives in natives-cache. Runners match release.yml (glibc ABI, macos-26).
# ci.yml's e2e job restores (and on a push miss, saves) the same Linux key, so
# it runs on this runner too.
#
# paths are duplicated because the workflow parser rejects YAML anchors.
# verify_natives.sh is in the path filter, not the cache key: the gate does
# not change build/natives.

on:
  push:
    branches: [main]
    paths:
      - "scripts/lib/native_pins.env"
      - "scripts/lib/common.sh"
      - "scripts/lib/natives.sh"
      - "scripts/natives/**"
      - "scripts/release/windows_natives.sh"
      - "scripts/release/verify_natives.sh"
      - "packages/cc_natives/native/**"
      - ".github/workflows/natives.yml"
      - ".github/actions/natives-cache/**"
  pull_request:
    paths:
      - "scripts/lib/native_pins.env"
      - "scripts/lib/common.sh"
      - "scripts/lib/natives.sh"
      - "scripts/natives/**"
      - "scripts/release/windows_natives.sh"
      - "scripts/release/verify_natives.sh"
      - "packages/cc_natives/native/**"
      - ".github/workflows/natives.yml"
      - ".github/actions/natives-cache/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: natives-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: natives (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
          - runner: macos-26
            os: macos
          - runner: windows-latest
            os: windows
    steps:
      # One step: a skipped harden-runner still runs its pre-hook, so a
      # Linux-only block sibling would install this allowlist on macOS and
      # Windows and then no-op the real audit step. block is Linux-only.
      # Hosts: apt, GitHub release assets, crates/rustup, freedesktop + wrapdb
      # (aec), PyPI (meson), SourceForge (LAME), Azure blobs (actions/cache).
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            *.blob.core.windows.net:443
            *.dl.sourceforge.net:443
            *.microsoft.com:443
            api.github.com:443
            downloads.sourceforge.net:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github.com:443
            gitlab.freedesktop.org:443
            index.crates.io:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            wrapdb.mesonbuild.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore natives cache
        id: natives-cache
        uses: $/.github/actions/natives-cache

      # Miss only. cargo/curl/tar/a compiler are on the image; meson/ninja are
      # not, and webrtc-audio-processing needs meson >= 0.63 (22.04's apt: 0.61).
      - name: Install AEC build tools (meson/ninja)
        if: runner.os == 'Linux' && steps.natives-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install AEC build tools (meson/ninja)
        if: runner.os == 'macOS' && steps.natives-cache.outputs.cache-hit != 'true'
        run: brew install meson ninja

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows' && steps.natives-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install AEC build tools (meson/ninja)
        if: runner.os == 'Windows' && steps.natives-cache.outputs.cache-hit != 'true'
        run: pip install meson ninja

      # No rift on Windows. OS via env, not ${{ }} inside run:.
      - name: Build native FFI libraries
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          if [ "$OS" = "windows" ]; then
            bash scripts/release/windows_natives.sh
          else
            bash scripts/natives/build_natives.sh build/natives
          fi

      # Hit and miss.
      - name: Verify the staged set
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          bash scripts/release/verify_natives.sh build/natives "$OS" desktop
          bash scripts/release/verify_natives.sh build/natives "$OS" server
