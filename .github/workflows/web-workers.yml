name: Web Workers

# Byte-level drift guard for the committed isolate_manager workers (web/*.js).
# Path-filtered so it stays off the main CI path. tool/check_workers.sh
# regenerates and diffs; the "asset exists" floor is test/tooling/web_workers_test.dart.
on:
  push:
    paths:
      - 'lib/features/pr_review/presentation/utils/diff_worker_core.dart'
      - 'lib/features/pr_review/presentation/utils/word_diff.dart'
      - 'packages/cc_domain/lib/features/pr_review/domain/services/diff_parser.dart'
      - 'lib/shared/widgets/markdown/markdown_worker_core.dart'
      - 'lib/shared/syntax/**'
      - 'packages/cc_markdown/lib/parser.dart'
      - 'packages/cc_markdown/lib/src/codec/**'
      - 'packages/cc_markdown/lib/src/parser/**'
      - 'packages/cc_markdown/lib/src/ast/**'
      - 'packages/cc_markdown/lib/src/plugins/**'
      - 'pubspec.yaml'
      - 'web/*.js'
      - 'tool/gen_workers.sh'
      - 'tool/check_workers.sh'
      - '.github/workflows/web-workers.yml'
  pull_request:
    paths:
      - 'lib/features/pr_review/presentation/utils/diff_worker_core.dart'
      - 'lib/features/pr_review/presentation/utils/word_diff.dart'
      - 'packages/cc_domain/lib/features/pr_review/domain/services/diff_parser.dart'
      - 'lib/shared/widgets/markdown/markdown_worker_core.dart'
      - 'lib/shared/syntax/**'
      - 'packages/cc_markdown/lib/parser.dart'
      - 'packages/cc_markdown/lib/src/codec/**'
      - 'packages/cc_markdown/lib/src/parser/**'
      - 'packages/cc_markdown/lib/src/ast/**'
      - 'packages/cc_markdown/lib/src/plugins/**'
      - 'pubspec.yaml'
      - 'web/*.js'
      - 'tool/gen_workers.sh'
      - 'tool/check_workers.sh'
      - '.github/workflows/web-workers.yml'

permissions: {}

concurrency:
  group: web-workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Check Web Workers are up to date
        run: ./tool/check_workers.sh
