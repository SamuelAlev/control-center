name: Dependency audit

# Reports outdated dependencies and fails on a pub.dev advisory, a retraction,
# or a discontinued package. Weekly and on demand.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: dep-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Report outdated dependencies
        run: dart pub outdated --show-all

      - name: Fail on advisories / retracted / discontinued packages
        run: |
          dart pub outdated --json > outdated.json
          python3 - outdated.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          flagged = []
          for p in data.get('packages', []):
              reasons = []
              if p.get('isCurrentAffectedByAdvisory'):
                  reasons.append('security advisory')
              if p.get('isCurrentRetracted'):
                  reasons.append('retracted')
              if p.get('isDiscontinued'):
                  reasons.append('discontinued')
              if reasons:
                  flagged.append(f"{p['package']}: {', '.join(reasons)}")
          if flagged:
              for f in flagged:
                  print(f"::error::{f}")
              sys.exit(1)
          print('No advisories, retractions, or discontinued dependencies.')
          PY
