name: CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Changed Dart files only. A repo-wide format gate fails on the existing
      # backlog. --set-exit-if-changed reports; it does not rewrite.
      - name: Check formatting (changed files)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
              -- '*.dart' | grep -v '\.g\.dart$' || true
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Dart files changed."
            exit 0
          fi
          printf 'Checking %d changed Dart file(s)…\n' "${#files[@]}"
          dart format --output=none --set-exit-if-changed "${files[@]}"

  build-web:
    name: web wasm (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: client
            directory: .
          - target: remote
            directory: apps/cc_remote
          - target: gallery
            directory: apps/cc_gallery
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Build WebAssembly bundle
        working-directory: ${{ matrix.directory }}
        run: flutter build web --release --wasm

      - name: Verify SkWasm and CanvasKit fallback artifacts
        working-directory: ${{ matrix.directory }}
        run: |
          test -f build/web/main.dart.wasm
          test -f build/web/main.dart.mjs
          test -f build/web/main.dart.js

  test:
    # Sharded by test file (tool/test_shard.dart). `flutter test --total-shards`
    # still compiles every file. Shard count is this list; --total is job-total.
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            esm.ubuntu.com:443
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Real bwrap + socat; the image ships neither. The apt hosts above are for this.
      - name: Install sandbox tooling (bwrap + socat)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Select shard
        env:
          # SHARD_TOTAL via env (template injection). matrix.shard is a literal.
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: >
          dart run tool/test_shard.dart
          --index ${{ matrix.shard }}
          --total "$SHARD_TOTAL"
          --output shard_files.txt

      - name: Test
        # bash for mapfile (one flutter test invocation).
        shell: bash
        # --concurrency=2: uncapped flutter_tester OOMs the runner.
        # No --coverage here; coverage.yml publishes the number.
        run: |
          mapfile -t files < shard_files.txt
          echo "Running ${#files[@]} test files"
          flutter test --concurrency=2 "${files[@]}"

  # Workspace package suites. Grouped so checkout + SDK setup is not paid per package.
  test-packages:
    name: packages (${{ matrix.runner }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [dart, flutter]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            esm.ubuntu.com:443
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Real bwrap + socat. Ubuntu 24.04's AppArmor blocks the user namespaces
      # bwrap needs; a failed sysctl shows up as a spawn error, not a skip.
      - name: Install sandbox tooling (bwrap + socat)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Test ${{ matrix.runner }} packages
        shell: bash
        run: scripts/ci/test_packages.sh ${{ matrix.runner }}

  # macOS and Windows package tests, push and dispatch only (10x / 2x minutes).
  # Not a PR gate.
  test-packages-os:
    name: packages (${{ matrix.runner }}, ${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
        runner: [dart, flutter]
    steps:
      - name: Harden runner
        # block is Linux-only.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter
        with:
          # Windows tests cannot load with windowing on. See setup-flutter.
          windowing: ${{ runner.os != 'Windows' }}

      # Default Windows shell is PowerShell.
      - name: Test ${{ matrix.runner }} packages
        shell: bash
        run: scripts/ci/test_packages.sh ${{ matrix.runner }}

  # Committed *.g.dart and l10n must match a fresh build_runner + gen-l10n.
  codegen:
    name: generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Regenerate
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          (cd apps/cc_remote && flutter gen-l10n)

      - name: Fail if anything changed
        run: |
          if ! git diff --quiet; then
            echo "::error::Committed generated code is stale. Run:"
            echo "  fvm dart run build_runner build --delete-conflicting-outputs"
            echo "  fvm flutter gen-l10n"
            echo "  (cd apps/cc_remote && fvm flutter gen-l10n)"
            echo "and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  # Boot cc_server against natives.yml's cache. Push + miss: build from source.
  # PR + miss: skip, unless the PR touches native boot paths (then build).
  e2e:
    name: server boot e2e (natives staged)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Pub/Flutter, plus the native-build hosts used on a cache miss.
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            *.blob.core.windows.net:443
            *.dl.sourceforge.net:443
            *.microsoft.com:443
            api.github.com:443
            downloads.sourceforge.net:443
            esm.ubuntu.com:443
            github.com:443
            gitlab.freedesktop.org:443
            index.crates.io:443
            objects.githubusercontent.com:443
            pub.dev:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            wrapdb.mesonbuild.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Restore natives cache
        id: natives-cache
        uses: $/.github/actions/natives-cache

      - name: Decide what a cache miss means here
        id: gate
        shell: bash
        env:
          HIT: ${{ steps.natives-cache.outputs.cache-hit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$HIT" = "true" ]; then
            echo "run=true"   >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            native_touch=false
            git fetch --no-tags --depth=1 origin -- "$GITHUB_BASE_REF" || true
            changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" || git diff --name-only HEAD)"
            if printf '%s\n' "$changed" | grep -Eq '^(packages/cc_natives/|scripts/natives/|packages/cc_server_core/lib/src/cc_server_runtime\.dart|packages/cc_server_core/lib/src/native_preflight\.dart)'; then
              native_touch=true
            fi
            if [ "$native_touch" = "true" ]; then
              echo "::error title=Server e2e required::This PR touches natives / cc_server_runtime / native_preflight and there is no natives cache. Build natives rather than skip."
              echo "run=true"   >> "$GITHUB_OUTPUT"
              echo "build=true"  >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Server e2e skipped::No natives cache for these inputs. This PR does not touch native boot paths — the server-boot suites did not run."
              echo "run=false"  >> "$GITHUB_OUTPUT"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true"   >> "$GITHUB_OUTPUT"
            echo "build=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Install AEC build tools (meson/ninja)
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config

      - name: Build native FFI libraries
        if: steps.gate.outputs.build == 'true'
        run: bash scripts/natives/build_natives.sh build/natives

      # A partial restore must not pass: the suites skip a missing native.
      - name: Verify the staged set
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/release/verify_natives.sh build/natives linux server

      - name: Server boot e2e
        # Two files boot cc_server at once. Native preflight loads ONNX, and
        # on a cold runner that stretch blows the 30s default while the other
        # file is doing the same. 2m still fails a hung boot.
        run: cd packages/cc_server_core && dart test --concurrency=2 --timeout=2m test/cc_server_e2e_test.dart test/fresh_boot_first_workspace_test.dart test/workspace_seeder_test.dart
        if: steps.gate.outputs.run == 'true'

      # First `dart run` compiles the kernel. Do it outside the test's boot timeout.
      - name: Warm the cc_server dart-run kernel cache
        if: steps.gate.outputs.run == 'true'
        run: dart run apps/cc_server/bin/cc_server.dart --version

      - name: Desktop thin-client boot (fork A)
        if: steps.gate.outputs.run == 'true'
        run: flutter test --concurrency=1 test/integration/fork_a_spawn_connect_test.dart

      # A PR cache-miss skip must show up in the log.
      - name: Report
        if: always()
        shell: bash
        env:
          GATE_RUN: ${{ steps.gate.outputs.run }}
        run: |
          if [ "$GATE_RUN" = "true" ]; then
            echo "Server-boot suites ran against staged natives."
          else
            echo "Server-boot suites were SKIPPED (no natives cache on a PR)."
          fi

  # Stable check name `build` for branch protection. test-packages-os is
  # omitted: it skips on PRs, and a skipped need fails this gate.
  build:
    if: always()
    needs: [analyze, codegen, build-web, test, test-packages, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check analyze and every test job passed
        run: |
          echo "analyze:       ${{ needs.analyze.result }}"
          echo "codegen:       ${{ needs.codegen.result }}"
          echo "build-web:     ${{ needs.build-web.result }}"
          echo "test:          ${{ needs.test.result }}"
          echo "test-packages: ${{ needs.test-packages.result }}"
          echo "e2e:           ${{ needs.e2e.result }}"
          [ "${{ needs.analyze.result }}" = "success" ] \
            && [ "${{ needs.codegen.result }}" = "success" ] \
            && [ "${{ needs.build-web.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.test-packages.result }}" = "success" ] \
            && [ "${{ needs.e2e.result }}" = "success" ]
