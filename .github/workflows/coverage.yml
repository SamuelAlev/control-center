name: Coverage

# Weekly, non-gating line coverage. ci.yml omits --coverage on purpose.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  report:
    name: line coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            archive.ubuntu.com:443
            esm.ubuntu.com:443
            security.ubuntu.com:443
            security.ubuntu.com:80
            github.com:443
            pub.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GTK headers for the native-asset build. Background: the SDK download
      # and pub get need none of it. The apt hosts above are for this.
      - name: Install system packages (GTK)
        id: system-packages
        background: true
        uses: $/.github/actions/linux-desktop-deps

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      # Not a dev_dependency: nothing imports it.
      - name: Install coverage formatter
        run: |
          dart pub global activate coverage
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # The suites build native assets.
      - name: Wait for system packages
        wait: [system-packages]

      # A failing suite does not fail this job; ci.yml already reports it.
      - name: Measure
        run: scripts/ci/coverage_report.sh build/coverage

      - name: Upload lcov
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: build/coverage/*.lcov
          if-no-files-found: warn
          retention-days: 30
