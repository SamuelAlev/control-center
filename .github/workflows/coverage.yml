name: Coverage

# Weekly, non-gating line coverage. ci.yml omits --coverage on purpose.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  report:
    name: line coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pub.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      # Not a dev_dependency: nothing imports it.
      - name: Install coverage formatter
        run: |
          dart pub global activate coverage
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # A failing suite does not fail this job; ci.yml already reports it.
      - name: Measure
        run: scripts/ci/coverage_report.sh build/coverage

      - name: Upload lcov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: build/coverage/*.lcov
          if-no-files-found: warn
          retention-days: 30
