name: Deploy design system

# cc_ui Widgetbook gallery → Cloudflare Worker "control-center-design-system"
# (apps/cc_gallery/wrangler.jsonc). Pull requests build only.
# The account id is not a secret.

on:
  push:
    branches: [main]
    paths:
      - "apps/cc_gallery/**"
      - "packages/cc_ui/**"
      - ".github/workflows/deploy-design-system.yml"
  pull_request:
    paths:
      - "apps/cc_gallery/**"
      - "packages/cc_ui/**"
      - ".github/workflows/deploy-design-system.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  # Per ref so a PR run does not cancel the main deploy.
  group: deploy-design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'build (no deploy)' || 'build and deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: d7dccdb80e94309a90054ed9c182ba05
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            api.cloudflare.com:443
            registry.npmjs.org:443
            sparrow.cloudflare.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      # So a stale committed navigation tree is not what gets deployed.
      - name: Generate Widgetbook navigation
        working-directory: apps/cc_gallery
        run: dart run build_runner build

      - name: Build web (SkWasm with CanvasKit fallback)
        working-directory: apps/cc_gallery
        run: flutter build web --release --wasm

      # Cloudflare's per-asset cap is 25 MiB.
      - name: Check asset size budget
        working-directory: apps/cc_gallery
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/common.sh"
          assert_asset_budget build/web 24

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        working-directory: apps/cc_gallery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.98.0 deploy
