name: Workflow audit

# zizmor over .github/workflows and .github/actions. Fails on findings and
# uploads SARIF. The version pin is exact (`latest` drifts inside the action).
# Fork PRs lack security-events write, so the SARIF upload fails after the audit.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  # Weekly: upstream rules and retags drift without a repo change.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF report
      contents: read
      actions: read # impostor-commit audits via the GitHub API
    steps:
      - name: Harden runner
        # audit: zizmor's container egress is outside the runner network namespace.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
