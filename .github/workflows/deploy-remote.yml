name: Deploy remote client

# cc_remote phone PWA → Cloudflare Worker "control-center-remote"
# (apps/cc_remote/wrangler.jsonc). The account id is not a secret.

on:
  push:
    branches: [main]
    paths:
      - "apps/cc_remote/**"
      # Every workspace package: an enumerated closure went stale once.
      - "packages/**"
      - "tool/gen_build_info.dart"
      - ".github/workflows/deploy-remote.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-remote
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: d7dccdb80e94309a90054ed9c182ba05
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            api.cloudflare.com:443
            registry.npmjs.org:443
            sparrow.cloudflare.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Stamp build identity
        run: |
          dart run tool/gen_build_info.dart
          echo "CC_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "CC_BUILD_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)" >> "$GITHUB_ENV"

      - name: Build web (SkWasm with CanvasKit fallback)
        working-directory: apps/cc_remote
        run: flutter build web --release --wasm

      # After the build. flutter build web writes version.json; the poll
      # manifest is deploy.json.
      - name: Write deploy.json
        run: dart run tool/gen_deploy_manifest.dart apps/cc_remote/build/web

      # Cloudflare's per-asset cap is 25 MiB.
      - name: Check asset size budget
        working-directory: apps/cc_remote
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/common.sh"
          assert_asset_budget build/web 24

      - name: Deploy to Cloudflare
        working-directory: apps/cc_remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.98.0 deploy
