name: Deploy web client

# Flutter web client → Cloudflare Worker "control-center-web" (wrangler.jsonc).
# Thin client: it dials cc_server. The account id is not a secret.

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "web/_headers"
      - "web/deploy.json"
      - "wrangler.jsonc"
      - "worker/**"
      - "tool/gen_build_info.dart"
      - ".github/workflows/deploy-webapp.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-webapp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: d7dccdb80e94309a90054ed9c182ba05
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            archive.ubuntu.com:443
            esm.ubuntu.com:443
            security.ubuntu.com:443
            security.ubuntu.com:80
            github.com:443
            pub.dev:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            api.cloudflare.com:443
            registry.npmjs.org:443
            sparrow.cloudflare.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GTK headers for the native-asset build. Background: the SDK download
      # and pub get need none of it. The apt hosts above are for this.
      - name: Install system packages (GTK)
        id: system-packages
        background: true
        uses: $/.github/actions/linux-desktop-deps

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      # `dart run tool/...` builds native assets.
      - name: Wait for system packages
        wait: [system-packages]

      - name: Stamp build identity
        run: |
          dart run tool/gen_build_info.dart
          echo "CC_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "CC_BUILD_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)" >> "$GITHUB_ENV"

      - name: Generate Web Workers
        run: ./tool/gen_workers.sh

      - name: Build web (SkWasm with CanvasKit fallback)
        run: flutter build web --release --wasm

      # After the build. flutter build web writes version.json; the poll
      # manifest is deploy.json.
      - name: Write deploy.json
        run: dart run tool/gen_deploy_manifest.dart build/web

      # Cloudflare's per-asset cap is 25 MiB.
      - name: Check asset size budget
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/common.sh"
          assert_asset_budget build/web 24

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.98.0 deploy
