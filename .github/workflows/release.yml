name: Release

# Tag push (`v*`) or workflow_dispatch. Draft GitHub Release (macOS DMG,
# Windows installer, Linux AppImage) plus GHCR images. Packaging is
# scripts/release/; natives come from natives-cache (seeded on main) or a
# source build on miss. macOS signing secrets are required (the provisioning
# profile authorizes keychain-access-groups). Windows signs only when
# WINDOWS_CERT is set.
# persist-credentials: false on every checkout — release auth is GH_TOKEN,
# and id-token jobs must not leave a token in .git/config.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0 (defaults to pubspec version)"
        required: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: v
        shell: bash
        # INPUT_VERSION via env, not ${{ }} inside run: (template injection).
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="${INPUT_VERSION}"
            if [ -z "$version" ]; then
              version="$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)"
            fi
            tag="v${version}"
          fi
          echo "Resolved version=$version tag=$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    runs-on: macos-26 # Apple Silicon (arm64)
    permissions:
      contents: read
      id-token: write # SLSA provenance
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Harden runner
        # block is Linux-only. This job holds the Developer ID certificate.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Use CocoaPods (disable Swift Package Manager for a reliable clean build)
        run: flutter config --no-enable-swift-package-manager

      - name: Install create-dmg + AEC build tools (meson/ninja)
        run: brew install create-dmg meson ninja

      - name: Prepare release build
        uses: $/.github/actions/prepare-release-build
        with:
          os: macos
          version: ${{ env.VERSION }}
          google-client-id: ${{ secrets.CC_BUILTIN_GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.CC_BUILTIN_GOOGLE_CLIENT_SECRET }}
          klipy-app-key: ${{ secrets.CC_BUILTIN_KLIPY_APP_KEY }}
          github-client-id: ${{ secrets.CC_BUILTIN_GITHUB_CLIENT_ID }}

      - name: Build macOS release
        run: flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Package (embed + sign + DMG + notarize)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/release/macos_package.sh "$VERSION"

      # Reuses the bundle macos_package.sh already built; the keychain is still up.
      - name: Package standalone cc_server (sign + notarize)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/release/cc_server_package.sh "$VERSION" macos

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Control-Center-${{ env.VERSION }}-arm64.dmg
            cc_server-${{ env.VERSION }}-macos-arm64.tar.gz

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: |
            Control-Center-*-arm64.dmg
          if-no-files-found: error

      - name: Upload standalone cc_server (macOS)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc_server-macos
          path: |
            cc_server-*-macos-*.tar.gz
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Harden runner
        # block is Linux-only.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install AEC build tools (meson/ninja)
        run: pip install meson ninja

      - name: Prepare release build
        uses: $/.github/actions/prepare-release-build
        with:
          os: windows
          version: ${{ env.VERSION }}
          google-client-id: ${{ secrets.CC_BUILTIN_GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.CC_BUILTIN_GOOGLE_CLIENT_SECRET }}
          klipy-app-key: ${{ secrets.CC_BUILTIN_KLIPY_APP_KEY }}
          github-client-id: ${{ secrets.CC_BUILTIN_GITHUB_CLIENT_ID }}
          fetch-code-server: "false"

      # pwsh: Git Bash shadows MSVC link.exe and Windows tar.exe. Prepend the
      # tar.exe setup-flutter staged. Do not use GITHUB_PATH (see that action).
      - name: Build Windows release
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'win-tar'
          $tar = Join-Path $dir 'tar.exe'
          if (-not (Test-Path $tar)) {
            throw "Windows tar.exe missing at $tar"
          }
          $env:PATH = "$dir;$env:PATH"
          flutter build windows --release --build-name="$env:VERSION" --build-number="$env:BUILD_NUMBER"

      - name: Package (bundle + verify + installer + sign + zip)
        shell: bash
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
          WINDOWS_CERT_PWD: ${{ secrets.WINDOWS_CERT_PWD }}
        run: bash scripts/release/windows_package.sh "$VERSION"

      # Unsigned, matching the installer. Reuses the bundle windows_package.sh built.
      - name: Package standalone cc_server
        shell: bash
        run: bash scripts/release/cc_server_package.sh "$VERSION" windows

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Control-Center-*-x64-setup.exe
            dist/Control-Center-*-windows-x64.zip
            cc_server-*-windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            dist/Control-Center-*-x64-setup.exe
            dist/Control-Center-*-windows-x64.zip
          if-no-files-found: error

      - name: Upload standalone cc_server (Windows)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc_server-windows
          path: |
            cc_server-*-windows-*.zip
          if-no-files-found: error

  # ubuntu-24.04, not 26.04: natives are copied into debian:trixie-slim
  # (glibc 2.41). A newer glibc will not load there.
  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      ARCH: x86_64
    steps:
      # A missing host fails the release. Do not put comments inside the
      # folded scalar below. Hosts: apt, GitHub release assets, crates/rustup,
      # freedesktop + wrapdb (aec), SourceForge (LAME; downloads. redirects
      # to *.dl), Flutter, sigstore, Azure blobs (actions/cache).
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            *.blob.core.windows.net:443
            *.dl.sourceforge.net:443
            *.microsoft.com:443
            api.github.com:443
            dl.google.com:443
            downloads.sourceforge.net:443
            esm.ubuntu.com:443
            fulcio.sigstore.dev:443
            github.com:443
            gitlab.freedesktop.org:443
            index.crates.io:443
            objects.githubusercontent.com:443
            pub.dev:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            wrapdb.mesonbuild.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev: tray CMake fails without it.
          # libpulse-dev and libmpv-dev are optional at build time; without
          # them meeting audio and playback are silently dead.
          # meson/ninja: WebRTC AEC. curl/zlib: sentry-native.
          sudo apt-get install -y \
            clang cmake meson ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libfuse2 \
            libmpv-dev \
            libsecret-1-dev \
            libkeybinder-3.0-dev libnotify-dev \
            libayatana-appindicator3-dev libx11-dev libxi-dev \
            libpulse-dev \
            libcurl4-openssl-dev zlib1g-dev

      - name: Prepare release build
        uses: $/.github/actions/prepare-release-build
        with:
          os: linux
          version: ${{ env.VERSION }}
          google-client-id: ${{ secrets.CC_BUILTIN_GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.CC_BUILTIN_GOOGLE_CLIENT_SECRET }}
          klipy-app-key: ${{ secrets.CC_BUILTIN_KLIPY_APP_KEY }}
          github-client-id: ${{ secrets.CC_BUILTIN_GITHUB_CLIENT_ID }}

      - name: Build Linux release
        run: flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Package (bundle + AppImage + tarball + checksums)
        run: bash scripts/release/linux_package.sh "$VERSION"

      # Feeds the cc-server image. Reuses the bundle linux_package.sh built.
      - name: Package standalone cc_server
        run: bash scripts/release/cc_server_package.sh "$VERSION" linux

      # Separate binary, not a flag on cc_server. Feeds the cc-server-demo image.
      - name: Package standalone cc_demo_server
        run: bash scripts/release/cc_demo_server_package.sh "$VERSION"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Control-Center-${{ env.VERSION }}-x86_64.AppImage
            Control-Center-${{ env.VERSION }}-linux-x64.tar.gz
            cc_server-${{ env.VERSION }}-linux-x64.tar.gz
            cc_demo_server-${{ env.VERSION }}-linux-x64.tar.gz

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            Control-Center-*-x86_64.AppImage
            Control-Center-*-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload standalone cc_server (Linux)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc_server-linux
          path: |
            cc_server-*-linux-*.tar.gz
          if-no-files-found: error

      - name: Upload standalone cc_demo_server (Linux)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc_demo_server-linux
          path: |
            cc_demo_server-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # download-artifact redirects to Azure blob storage.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            *.blob.core.windows.net:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cryptography is not on the image, and the egress block cannot fetch it later.
      - name: Install appcast signing dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check cryptography

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # Platform bundles only. A download-everything default also pulls
          # the containers job's *.dockerbuild records and can fail on them.
          pattern: "{macos,windows,linux,cc_server-*}"

      # Sparkle keys, not the code-signing certs. Drafts stay off
      # releases/latest until published. BUILD_NUMBER must match the build
      # jobs' --build-number (sparkle:version vs CFBundleVersion).
      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
          SPARKLE_DSA_PRIVATE_KEY: ${{ secrets.SPARKLE_DSA_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/release/gen_appcast.sh "$VERSION" "$TAG" "$BUILD_NUMBER"

      - name: Create draft release (assemble + checksums + notes)
        run: bash scripts/release/make_release.sh

  # GHCR: cc-server, demo, web, phone PWA, signaling. Reuses the Linux
  # cc_server archive. Separate from the Cloudflare deploys.
  containers:
    needs: [prepare, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images + attestations
      id-token: write # SLSA provenance
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Harden runner
        # audit: base-image pulls hit Docker Hub and GHCR hosts that move.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: $/.github/actions/setup-flutter

      - name: Resolve image namespace (GHCR requires a lowercase owner)
        id: ns
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Stamp build identity
        run: |
          dart run tool/gen_build_info.dart --version "$VERSION"
          echo "CC_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Regenerates committed web/*.js so the image cannot ship a stale worker.
      - name: Build web client (root app)
        run: |
          ./tool/gen_workers.sh
          flutter build web --release --wasm

      - name: Build phone PWA (cc_remote)
        working-directory: apps/cc_remote
        run: |
          flutter pub get
          flutter build web --release --wasm

      # After both builds. flutter build web owns version.json.
      - name: Write deploy.json manifests
        run: |
          dart run tool/gen_deploy_manifest.dart build/web
          dart run tool/gen_deploy_manifest.dart apps/cc_remote/build/web

      - name: Download standalone cc_server (Linux)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cc_server-linux
          path: artifacts/cc_server-linux

      - name: Download standalone cc_demo_server (Linux)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cc_demo_server-linux
          path: artifacts/cc_demo_server-linux

      - name: Stage docker build contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/cc_server/bundle
          tar xzf artifacts/cc_server-linux/cc_server-*-linux-x64.tar.gz \
            -C docker/cc_server/bundle --strip-components=1
          mkdir -p docker/cc_demo_server/bundle
          tar xzf artifacts/cc_demo_server-linux/cc_demo_server-*-linux-x64.tar.gz \
            -C docker/cc_demo_server/bundle --strip-components=1
          mkdir -p docker/web/site docker/cc_remote/site
          cp -R build/web/. docker/web/site/
          cp -R apps/cc_remote/build/web/. docker/cc_remote/site/

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build + push cc-server image
        id: cc_server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/cc_server
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-server:${{ env.VERSION }}
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-server:latest
          # Sigstore attestation is attached in the next step.
          provenance: false

      - name: Attest cc-server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.ns.outputs.owner }}/cc-server
          subject-digest: ${{ steps.cc_server.outputs.digest }}
          push-to-registry: true

      - name: Build + push cc-server-demo image
        id: cc_server_demo
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/cc_demo_server
          # Shared Dockerfile; CC_SERVER_BINARY selects the binary.
          file: docker/cc_server/Dockerfile
          build-args: |
            CC_SERVER_BINARY=cc_demo_server
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-server-demo:${{ env.VERSION }}
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-server-demo:latest
          provenance: false

      - name: Attest cc-server-demo image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.ns.outputs.owner }}/cc-server-demo
          subject-digest: ${{ steps.cc_server_demo.outputs.digest }}
          push-to-registry: true

      - name: Build + push web client image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/web
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-webapp:${{ env.VERSION }}
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-webapp:latest
          provenance: false

      - name: Attest web client image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.ns.outputs.owner }}/cc-webapp
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Build + push phone PWA image
        id: remote
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/cc_remote
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-remote:${{ env.VERSION }}
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-remote:latest
          provenance: false

      - name: Attest phone PWA image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.ns.outputs.owner }}/cc-remote
          subject-digest: ${{ steps.remote.outputs.digest }}
          push-to-registry: true

      # Compiles in-image: no natives, no monorepo context.
      - name: Build + push signaling relay image
        id: signaling
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/cc_signaling_server
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-signaling-server:${{ env.VERSION }}
            ghcr.io/${{ steps.ns.outputs.owner }}/cc-signaling-server:latest
          provenance: false

      - name: Attest signaling relay image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
