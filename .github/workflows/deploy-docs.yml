name: Deploy docs

# docs/ (Astro) → the Worker in docs/wrangler.jsonc (https://usectrl.dev).
# Replaces Cloudflare's git auto-build; disable that once this is green.
# Pull requests build and test only.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  # Per ref so a PR run does not cancel the main deploy.
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'build (no deploy)' || 'build and deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: d7dccdb80e94309a90054ed9c182ba05
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Fonts are self-hosted; a new CDN host fails this allowlist.
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
            api.cloudflare.com:443
            sparrow.cloudflare.com:443
            workers.cloudflare.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        working-directory: docs
        run: corepack enable pnpm && pnpm --version

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: docs
        run: pnpm test

      - name: Build site
        working-directory: docs
        run: pnpm build

      # Cloudflare's per-asset cap is 25 MiB.
      - name: Check asset size budget
        working-directory: docs
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/common.sh"
          assert_asset_budget dist 24

      # Repo-pinned wrangler, the same one the site was built with.
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
