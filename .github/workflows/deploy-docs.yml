name: Deploy docs

# docs/ (Astro) → the Worker in docs/wrangler.jsonc (https://usectrl.dev).
# Replaces Cloudflare's git auto-build; disable that once this is green.
# Pull requests build and test only.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".nvmrc"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".nvmrc"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  # Per ref so a PR run does not cancel the main deploy.
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'build (no deploy)' || 'build and deploy' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: d7dccdb80e94309a90054ed9c182ba05
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # Fonts are self-hosted; a new CDN host fails this allowlist.
          allowed-endpoints: >
            *.blob.core.windows.net:443
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            api.cloudflare.com:443
            sparrow.cloudflare.com:443
            workers.cloudflare.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: docs/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: docs
        run: pnpm test

      - name: Build site
        working-directory: docs
        run: pnpm build

      # Cloudflare's per-asset cap is 25 MiB.
      - name: Check asset size budget
        working-directory: docs
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/common.sh"
          assert_asset_budget dist 24

      # Repo-pinned wrangler, the same one the site was built with.
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
