name: cc_harness
description: "The Control Center harness kernel — the pure-Dart agent loop (messages, provider port, tools, compaction, steering, hooks, subagents, slash commands) plus per-run completion contracts. Depends on collection + meta only: no dart:io, no other cc_* package. Web-safe contracts, VM-safe loop — embeddable by cc_server, cc_worker, tests and eventually third parties."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  collection: ^1.19.1
  meta: any

dev_dependencies:
  test: any
  lints: any
