name: cc_data
description: "Remote data layer for Control Center — repository adapters that satisfy reads/writes over the cc_rpc client (repo/call + sub/subscribe). Always RPC: every client (desktop LOCAL/REMOTE, web, phone) uses these adapters. Web-safe (cc_domain + cc_rpc + cc_harness, no dart:io/ffi)."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  cc_domain:
    path: ../cc_domain
  cc_harness:
    path: ../cc_harness
  cc_rpc:
    path: ../cc_rpc

dev_dependencies:
  test: any
  lints: any
