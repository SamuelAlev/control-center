name: cc_persistence
description: "Pure-Dart persistence for the headless server — opens the Drift/SQLite database over package:sqlite3 with no Flutter (no drift_flutter, no path_provider). Compiles into a native `dart build cli` server binary; the desktop app keeps its own Flutter-provided connection."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  drift: ^2.35.2
  sqlite3: ^3.7.0
  # Vector-search SQLite extension (vector_init / vector_full_scan_stream) for the
  # memory-facts + code-graph embedding queries. Ships prebuilt native libraries
  # for every desktop platform as a `DynamicLoadingBundled` code asset, which
  # `dart build cli` bundles beside the server binary the same way it bundles
  # libsqlite3 — no Flutter, no manual scripts/natives step. `openServerDatabase`
  # registers it as a process-global auto-extension. Its hooks/code_assets ^1
  # constraints need the root's ^2 overrides until upstream widens them.
  # Exact: patches/sqlite_vector@1.1.2.patch adds Windows ARM64 (no upstream
  # prebuilt) and only applies to this version. CI's first `pub get` runs
  # without patchwork's overrides, so a caret range re-resolves to the newest
  # release and the patch no longer matches. Bump with `patchwork carry` and
  # SQLITE_VECTOR_REF (scripts/lib/native_pins.env) together.
  sqlite_vector: 1.1.2
  # The schema + DAOs map rows to/from shared-kernel domain types (pure Dart).
  cc_domain:
    path: ../cc_domain
  cc_harness:
    path: ../cc_harness
  uuid: ^4.6.0

dev_dependencies:
  lints: any
  test: any
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
