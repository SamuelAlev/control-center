name: cc_ui
description: "Control Center design system — tokens, theme, foundation primitives, and components."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: any
  # Keeps anchored overlays (menus, selects, popovers) clickable when they float
  # over a web platform view (an <iframe>/embedded webview), which would
  # otherwise swallow the taps. Drives CcOverlayAnchor.interceptPointer. No-op
  # off-web, so it never touches the desktop/native render path.
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Base design-system fonts, bundled as host assets so consumers NEVER fetch
  # them over the network (only a user-selected family is fetched, on demand,
  # through the host — see CcFontRegistry).
  # Referenced via the `packages/cc_ui/<family>` name convention in CcFonts.
  #
  # cc_ui is the SOLE owner of these files in the repo — the main app, cc_remote,
  # and cc_gallery all resolve them by the `packages/cc_ui/<family>` name rather
  # than bundling their own copy (Flutter forbids a package's `fonts:` from
  # pointing outside its own folder, so this package is the single home). To swap
  # the UI font, change the family name + assets here AND the `CcFonts.uiFamily`
  # token in `lib/src/theme/cc_fonts.dart`; nothing else hard-codes it.
  #
  # Both defaults are VARIABLE fonts — one file each, full `wght` axis. Flutter
  # (>=3.24) maps `TextStyle.fontWeight` onto the font's `wght` axis, so the
  # 400/500/600/700 call sites render at the right weight from the single file
  # (no per-weight assets needed). Manrope wght 200–800; Fira Code wght 300–700.
  # Neither has italic faces (italic requests synthesize a faux oblique).
  #
  # PhosphorRegular is the icon font behind every `CcIcons`/`AppIcons` glyph. It
  # is vendored here (MIT, phosphor-icons/core v2.0.8) rather than pulled from
  # `phosphoricons_flutter`, because that package's pubspec declares all SIX
  # styles and there is no way to opt out of a dependency's font declarations:
  # the five we never reference had no const IconData pointing at them, so the
  # icon tree-shaker skipped them, they were copied verbatim into the bundle,
  # and Flutter web downloaded all 2.46 MB of them at engine boot. Vendoring the
  # one style we use keeps subsetting (the shaker treats a package font like any
  # other) and deletes the rest. Do NOT add the other styles here.
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Variable.ttf
    - family: Fira Code
      fonts:
        - asset: fonts/FiraCode-VF.ttf
    - family: PhosphorRegular
      fonts:
        - asset: fonts/Phosphor-Regular.ttf
