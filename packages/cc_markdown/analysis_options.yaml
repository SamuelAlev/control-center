# Analyzer config for the cc_markdown engine package.
#
# cc_markdown is a self-contained markdown engine: parser + AST + plugins are
# pure Dart; the render/selection layers build on package:flutter/widgets.dart.
# The ONLY file allowed to import Material is lib/src/selection/context_menu.dart
# (AdaptiveTextSelectionToolbar). The package MUST NOT import Riverpod, cc_ui,
# highlight, l10n, or the host app (package:control_center/...). That boundary
# is enforced by test/core/architecture_constraints_test.dart in the app.
# ONE rule table: include the ROOT config (which itself includes
# flutter_lints) instead of flutter_lints plus a hand-copied subset of the root
# rules. The copies silently missed `avoid_print`, `avoid_dynamic_calls`,
# `unawaited_futures`, `cancel_subscriptions`, `close_sinks` and ~20 more, and
# every new root rule would have missed them too. Opt DOWN explicitly below.
include: ../../analysis_options.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Opted down from the root, narrowly: a formatting preference this package
    # predates, and a doc-link lint that false-positives on `[FrameworkType]`
    # references the doc site does not import. The SAFETY rules from the root
    # all apply.
    always_put_control_body_on_new_line: false
    comment_references: false
    always_use_package_imports: true
    avoid_relative_lib_imports: true
    directives_ordering: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_constructors_first: true
    use_super_parameters: true
    always_declare_return_types: true
