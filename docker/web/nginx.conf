# Static nginx config for the Control Center WEB CLIENT (self-hosted Docker).
#
# Match worker/csp.js: identity probes and encrypted WebSockets may reach the
# selected server, while decrypted media stays on the app's own origin through
# the Service Worker resource facade. No connected-origin cookie is needed.
# fonts.gstatic.com serves the engine's Noto fallbacks; user-selected fonts
# arrive through the resource facade and register from bytes.
#
# Listens on 8080 (unprivileged) — the base image runs nginx as a non-root user.

# Per-path Cache-Control, evaluated against the (post-try_files) $uri so every
# index.html response — root, deep route, or the file itself — plus the
# version-orchestrating entry files always revalidate. Flutter's main.dart.js is
# not content-hashed, so the service worker owns versioning. An empty value adds
# no header (nginx skips empty add_header values), leaving hashed assets to the
# browser's default heuristic caching.
map $uri $cc_cache_control {
    default                       "";
    /index.html                   "no-cache";
    /flutter_bootstrap.js         "no-cache";
    /flutter_service_worker.js    "no-cache";
    /cc_resource_bridge.js        "no-cache";
    /cc_resource_worker.js        "no-cache";
    /cc_resource_ws_shim.js       "no-cache";
    /manifest.json                "no-cache";
    /deploy.json                 "no-cache";
}

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip text-like assets (Flutter ships .js/.json/.wasm uncompressed).
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/wasm image/svg+xml application/manifest+json;

    # Security headers — mirror worker/csp.js and web/_headers. `always` keeps
    # them on error responses. Keep add_header at the server level so location
    # blocks do not drop the policy; the map drives cache control.
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Permissions-Policy      "camera=(), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https: http://localhost:* http://127.0.0.1:* https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control            $cc_cache_control always;

    # SPA fallback: client-side routing + deep links (the pairing fragment)
    # resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
